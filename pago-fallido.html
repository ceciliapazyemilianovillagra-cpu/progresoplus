<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago no completado — VidaPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--violet:#2F6B4F;--cream:#F6F2E7;--ink:#25332B;--muted:#6E7D72;--line:#E4E4D6}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--ink);min-height:100dvh;display:grid;place-items:center;padding:20px}
.card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px 28px;box-shadow:0 18px 45px #0002;text-align:center}
h1{font-size:22px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 22px;font-size:14px;line-height:1.5}
a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;background:var(--violet);color:#fff;font-weight:800;font-size:15px;text-decoration:none;box-sizing:border-box}
</style></head><body>
<div class="card">
<h1>Tu pago no se completó</h1>
<p>Puede haber sido rechazado por el medio de pago o quedó pendiente. No te preocupes, no se generó ningún cobro ni cuenta. Podés intentarlo de nuevo cuando quieras.</p>
<a class="btn" href="/comprar.html">Volver a intentar</a>
</div>
</body></html>
