.home-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);text-align:left}

details.mod-sec summary h2:before{content:'▸';font-size:13px;color:var(--muted);transition:.15s;display:inline-block}

:root{--violet:#2F6B4F;--violet-2:#3F8A67;--teal:#3F8A67;--pink:#C1653B;--slate:#6E7D72}
.hero-grad{background:linear-gradient(135deg,var(--violet),var(--violet-2));border-radius:24px;padding:20px;margin:18px 0 8px;color:#fff;box-shadow:0 16px 32px #2F6B4F40}
.hero-grad-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.hero-grad-top b{font-size:26px;letter-spacing:-.5px}
.hero-bar{height:8px;background:#ffffff33;border-radius:99px;margin:10px 0 8px;overflow:hidden}
.hero-bar i{display:block;height:100%;background:#fff;border-radius:inherit;transition:width .3s}
.hero-grad-sub{font-size:12px;opacity:.9;font-weight:600}
.home-btn{gap:14px}
.home-btn-txt{flex:1;min-width:0}
.home-btn-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.home-btn-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.save{background:linear-gradient(135deg,var(--violet),var(--violet-2))!important;color:#fff!important;box-shadow:0 10px 22px #2F6B4F40!important}
.check.done{background:var(--violet)!important;border-color:var(--violet)!important;color:#fff!important}
details.mod-sec summary h2:before{color:var(--violet)}
.brand img{background:none!important;box-shadow:none!important;padding:0!important}
.avatar{background:var(--violet)!important;box-shadow:0 9px 20px #2F6B4F40!important}
.spin{border-top-color:var(--violet)!important}
.cal-cell.sel{background:var(--violet)!important}
.cal-dot.full{background:var(--violet)!important}
.progress i{background:var(--violet)!important}
input[type=checkbox]{accent-color:var(--violet)}
.more{background:#EEEAFB!important;color:var(--violet)!important}
input,textarea{background:var(--cream)!important}
.set-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row b{width:64px;font-size:13px;flex:none}
.set-row input{width:56px;margin:0;padding:8px;text-align:center}
.set-row button{flex:1;white-space:nowrap;border-radius:10px;padding:8px}
.descanso-box{text-align:center;background:var(--violet);color:#fff;border-radius:16px;padding:14px;margin-top:14px}
.descanso-box small{opacity:.85;font-weight:800;letter-spacing:.5px}
.descanso-box b{font-size:30px;display:block;margin-top:2px}
.ej-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--mint)}
.ej-results{max-height:50vh;overflow-y:auto;margin-top:10px}
.ej-results .item{cursor:pointer}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{display:flex;align-items:center;gap:6px;background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.nutri-search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:13px;font-size:14px;margin-bottom:4px}
.nutri-day{margin-bottom:12px}
.nutri-day-name{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.nutri-day-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nutri-slot{background:var(--cream);border:1px dashed var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nutri-slot.filled{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--violet-2);color:var(--ink);text-align:left;align-items:flex-start}
.nutri-slot.filled b{font-size:11.5px;font-weight:800;line-height:1.2}
.nutri-slot.filled span{font-size:9.5px;color:var(--muted);font-weight:700}
.nutri-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.nutri-row:last-child{border-bottom:0}
.nutri-row-tipo{width:64px;flex:none;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.nutri-row-main{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.nutri-row-input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:13.5px;background:var(--cream);font-family:inherit;color:var(--ink)}
.nutri-row-input[readonly]{background:var(--card);border-left:3px solid var(--violet-2);cursor:pointer;font-weight:700}
.nutri-row-platos,.nutri-row-clear{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--violet)}
.nutri-row-platos svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

function nutriComidaRow(day,tipo,comidas){const c=comidas.find(x=>x.day_of_week===day&&x.meal_type===tipo);const valor=c?(c.recipe_id?c.title:(c.texto_libre||'')):'';const esReceta=!!(c&&c.recipe_id);return `<div class="nutri-row"><div class="nutri-row-tipo">${tipo}</div><div class="nutri-row-main"><input class="nutri-row-input" placeholder="Ej: Milanesas con puré" value="${esc(valor)}" ${esReceta?'readonly onclick="abrirDetalleReceta(\''+c.recipe_id+'\')"':''} onchange="guardarComidaTextoUI(${day},'${tipo}',this.value)"><button class="nutri-row-platos" onclick="abrirSelectorReceta(${day},'${tipo}')" aria-label="Elegir del recetario"><svg viewBox="0 0 24 24"><path d="M4 12h4l2-7 4 14 2-7h4"/></svg></button>${c?`<button class="nutri-row-clear" onclick="quitarComidaUI('${c.id}')" aria-label="Quitar">✕</button>`:''}</div></div>`}
function calcularBalanceCalorico(comidas){const s=AUTH?.settings||{};const sortedPesos=DB.pesos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));const pesoKg=sortedPesos.length?Number(sortedPesos[0].kg):null;const alturaCm=s.altura_cm?Number(s.altura_cm):null;const edad=s.edad?Number(s.edad):null;const sexo=s.sexo||null;const actividad=s.nivel_actividad||null;if(!pesoKg||!alturaCm||!edad||!sexo||!actividad)return null;const bmr=sexo==='f'?(10*pesoKg+6.25*alturaCm-5*edad-161):(10*pesoKg+6.25*alturaCm-5*edad+5);const factores={sedentario:1.2,ligero:1.375,moderado:1.55,activo:1.725,muy_activo:1.9};const tdee=Math.round(bmr*factores[actividad]);const porDia={};comidas.forEach(c=>{if(c.calories_per_serving)porDia[c.day_of_week]=(porDia[c.day_of_week]||0)+c.calories_per_serving});const dias=Object.keys(porDia);const promedio=dias.length?Math.round(dias.reduce((sum,d)=>sum+porDia[d],0)/dias.length):null;return {bmr:Math.round(bmr),tdee,promedio,diasConDatos:dias.length}}
function nutriBalanceHtml(comidas){const b=calcularBalanceCalorico(comidas);if(!b)return `<div class="card" style="margin-bottom:14px"><b>Balance calórico</b><p class="sub" style="margin:6px 0 0">Completá peso (en Cuerpo), y altura, edad, sexo y nivel de actividad en <a onclick="editarPerfilSalud()" style="color:var(--violet);cursor:pointer;font-weight:700">Mis datos</a> para ver si tu semana está en déficit, mantenimiento o superávit.</p></div>`;let veredicto,color;if(b.promedio==null){veredicto='Asigná comidas del recetario (con calorías) para calcular tu promedio diario.';color='var(--muted)'}else{const dif=b.promedio-b.tdee;if(dif<-100){veredicto=`Déficit de ~${Math.abs(dif)} kcal/día`;color='var(--violet)'}else if(dif>100){veredicto=`Superávit de ~${dif} kcal/día`;color='var(--pink)'}else{veredicto='Mantenimiento (± 100 kcal/día)';color='var(--accent)'}}return `<div class="card" style="margin-bottom:14px"><b>Balance calórico</b><div style="display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 4px"><div><small class="sub" style="display:block">Metabolismo basal</small><b>${b.bmr} kcal</b></div><div><small class="sub" style="display:block">Gasto diario estimado</small><b>${b.tdee} kcal</b></div><div><small class="sub" style="display:block">Promedio planificado</small><b>${b.promedio!=null?b.promedio+' kcal':'—'}</b></div></div><p class="sub" style="margin:4px 0 0;color:${color};font-weight:700">${veredicto}</p>${b.promedio!=null&&b.diasConDatos<7?`<p class="sub" style="margin:4px 0 0">Solo cuenta días con comidas del recetario (con calorías cargadas); el texto libre no suma calorías. Calculado sobre ${b.diasConDatos} de 7 días.</p>`:''}</div>`}
function nutriPlanHtml(DIAS,TIPOS,comidas){const dietChips=`<div class="chip-group" style="margin:0 0 4px">${[['','Cualquier dieta'],['vegetariano','Vegetariana'],['vegano','Vegana'],['sin_tacc','Sin TACC'],['keto','Keto']].map(([v,l])=>`<button class="chip ${NUTRI_FILTROS.diet===v?'on':''}" onclick="NUTRI_FILTROS.diet='${v}';render()">${l}</button>`).join('')}</div>`;const hoy=new Date().getDay();return `<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><b>Generar semana</b><button class="link" onclick="generarSemanaRandomUI()">Generar aleatoriamente</button></div>${dietChips}<p class="sub" style="margin:6px 0 0">La dieta elegida filtra el recetario y "Generar aleatoriamente".</p></div>${nutriBalanceHtml(comidas)}${DIAS.map((nombre,d)=>`<details class="mod-sec" ${d===hoy?'open':''}><summary><h2>${nombre}</h2></summary><div class="mod-sec-body">${TIPOS.map(tipo=>nutriComidaRow(d,tipo,comidas)).join('')}</div></details>`).join('')}<div style="display:flex;gap:10px;margin-top:14px"><button class="link" style="flex:1;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center" onclick="enviarMenuWhatsAppUI()">Enviar por WhatsApp</button><button class="link" style="flex:1;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center" onclick="descargarMenuPDF()">Descargar PDF</button></div>`}

function textoMenuSemana(){const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const TIPOS=['desayuno','almuerzo','merienda','cena'];const comidas=(NUTRI_PLAN&&NUTRI_PLAN.comidas)||[];let lines=['MENÚ SEMANAL - VIDAPLUS',''];for(let d=0;d<7;d++){const delDia=TIPOS.map(tipo=>{const c=comidas.find(x=>x.day_of_week===d&&x.meal_type===tipo);if(!c)return null;const nombre=c.recipe_id?c.title:c.texto_libre;return nombre?'  '+tipo+': '+nombre:null}).filter(Boolean);if(delDia.length){lines.push(DIAS[d].toUpperCase());lines.push(...delDia);lines.push('')}}return lines.join('\n').trim()}

async function descargarMenuPDF(){const comidas=(NUTRI_PLAN&&NUTRI_PLAN.comidas)||[];if(!comidas.length){say('Todavía no armaste el menú de la semana');return}busy(1,'Generando PDF…');try{const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const TIPOS=['desayuno','almuerzo','merienda','cena'];const idsRecetas=[...new Set(comidas.filter(c=>c.recipe_id).map(c=>c.recipe_id))];const detalles={};for(const id of idsRecetas){try{detalles[id]=await api('getReceta',{id})}catch(_){}}let html='<html><head><meta charset="utf-8"><title>Menú semanal - VidaPlus</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#222}h1{margin-bottom:2px}h2{margin:26px 0 8px;border-bottom:2px solid #2F6B4F;padding-bottom:4px}h3{margin:16px 0 2px}ul,ol{margin:4px 0 10px;padding-left:20px}.sub{color:#666;font-size:13px;margin:0 0 18px}</style></head><body>';html+='<h1>Menú semanal</h1><p class="sub">VidaPlus</p>';for(let d=0;d<7;d++){const delDia=TIPOS.map(tipo=>({tipo,c:comidas.find(x=>x.day_of_week===d&&x.meal_type===tipo)})).filter(x=>x.c);if(!delDia.length)continue;html+='<h2>'+DIAS[d]+'</h2>';for(const {tipo,c} of delDia){const nombre=c.recipe_id?c.title:c.texto_libre;html+='<h3>'+tipo.toUpperCase()+': '+esc(nombre||'')+'</h3>';const r=c.recipe_id?detalles[c.recipe_id]:null;if(r){if(r.ingredientes&&r.ingredientes.length)html+='<b>Ingredientes</b><ul>'+r.ingredientes.map(i=>'<li>'+(i.quantity?i.quantity+' '+(i.unit||''):'')+' '+esc(i.name)+'</li>').join('')+'</ul>';if(r.steps&&r.steps.length)html+='<b>Preparación</b><ol>'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'}}}html+='</body></html>';const w=window.open('','_blank');if(!w){say('Habilitá las ventanas emergentes para descargar el PDF');busy(0);return}w.document.write(html);w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(_){}},350)}catch(e){say(e.message)}busy(0)}
let MOTIVACION=null,MOTIVACION_LIBROS=null,MOTIVACION_LIBRO_SEL=null,MOTIVACION_HIST=(()=>{try{return JSON.parse(localStorage.getItem('motivacion_hist')||'[]')}catch{return[]}})();async function goMotivacionInicio(){MOTIVACION=null;MOTIVACION_LIBRO_SEL=null;view='motivacion';render();busy(1,'Buscando tus libros…');try{MOTIVACION_LIBROS=await api('listBooks')}catch(e){MOTIVACION_LIBROS=[];say(e.message)}finally{busy(0);render()}}async function goMotivacionLibro(archivo){MOTIVACION_LIBRO_SEL=archivo;busy(1,'Buscando una lectura…');try{MOTIVACION=await api('getMotivacion',{archivo,excluir:MOTIVACION_HIST});MOTIVACION_HIST=[...MOTIVACION_HIST,MOTIVACION.capitulo.titulo].slice(-10);try{localStorage.setItem('motivacion_hist',JSON.stringify(MOTIVACION_HIST))}catch(_){}render()}catch(e){MOTIVACION=null;render();say(e.message)}finally{busy(0)}}

async function comenzarEntrenamiento(diaId){const dia=RUTINA_SEL.dias.find(d=>d.id===diaId);if(!dia||!dia.ejercicios.length)return say('Este día no tiene ejercicios todavía');busy(1,'Iniciando…');try{SESION=await api('startSesion',{rutina_dia_id:diaId,nombre:dia.nombre});SESION_DIA=dia;SESION_IDX=0;SESION_SETS={};ULTIMO_CACHE={};view='entrenar';render()}catch(e){say(e.message)}finally{busy(0)}}
function claveSet(ejId,n){return ejId+'#'+n}
async function serieCompletada(ejId,setNum,pesoEl,repsEl){const peso=pesoEl.value?Number(pesoEl.value):null,reps=repsEl.value?Number(repsEl.value):null;try{await api('logSerie',{sesion_id:SESION.id,ejercicio_id:ejId,set_num:setNum,peso,repeticiones:reps});SESION_SETS[claveSet(ejId,setNum)]=true;iniciarDescanso();render()}catch(e){say(e.message)}}
function iniciarDescanso(){const ej=SESION_DIA.ejercicios[SESION_IDX];let seg=ej.descanso_seg||60;clearInterval(DESCANSO_TIMER);const pintar=()=>{const el=$('#descansoTimer');if(el)el.textContent=String(Math.floor(seg/60)).padStart(2,'0')+':'+String(seg%60).padStart(2,'0')};pintar();const box=$('#descansoBox');if(box)box.classList.remove('hidden');DESCANSO_TIMER=setInterval(()=>{seg--;if(seg<=0){clearInterval(DESCANSO_TIMER);const b=$('#descansoBox');if(b)b.classList.add('hidden');return}pintar()},1000)}
function siguienteEjercicio(){clearInterval(DESCANSO_TIMER);if(SESION_IDX<SESION_DIA.ejercicios.length-1){SESION_IDX++;render()}else finalizarEntrenamiento()}
function anteriorEjercicio(){clearInterval(DESCANSO_TIMER);if(SESION_IDX>0){SESION_IDX--;render()}}

function dietaHtml(){let s=AUTH?.settings||{};let sortedPesos=DB.pesos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));let pesoKg=sortedPesos[0]?.kg;let alturaM=s.altura_cm?s.altura_cm/100:null;let imc=(pesoKg&&alturaM)?+(pesoKg/(alturaM*alturaM)).toFixed(1):null;let cat=imc==null?'':imc<18.5?'Bajo peso':imc<25?'Peso normal':imc<30?'Sobrepeso':imc<35?'Obesidad grado I':imc<40?'Obesidad grado II':'Obesidad grado III';return `<div class="card" style="margin:0 0 14px"><div class="chart-summary"><b>${imc??'—'}</b><span>${cat||(!alturaM?'Cargá tu altura en "Mis datos"':'Registrá tu peso arriba')}</span></div><p class="sub" style="margin-top:6px">${pesoKg&&alturaM?pesoKg+' kg · '+s.altura_cm+' cm':'Falta tu altura para calcular el IMC'}</p></div>${(()=>{if(!alturaM||sortedPesos.length<2)return '';let hist=sortedPesos.slice().reverse().slice(-8);let vals=hist.map(p=>+(p.kg/(alturaM*alturaM)).toFixed(1));let min=Math.min(...vals,18.5),max=Math.max(...vals,30);return `<div class="sub" style="font-weight:800;margin:14px 0 6px">Evolución del IMC</div><div class="bar-chart">${hist.map((p,i)=>{let v=vals[i],h=Math.round(10+((v-min)/(max-min||1))*100);let col=v<18.5?'var(--slate)':v<25?'var(--teal)':v<30?'var(--accent)':'var(--pink)';return `<div class="bar-col"><div class="bar" style="height:${h}%;background:${col}"></div><small>${v}</small></div>`}).join('')}</div><p class="sub" style="margin-top:4px">Según tus registros de peso, con tu altura de ${s.altura_cm} cm.</p>`})()}<div class="sub" style="font-weight:800;margin-bottom:6px">Priorizar</div><ul class="ej-instrucciones" style="margin-bottom:14px"><li>Vegetales sin almidón en la mitad del plato: brócoli, espinaca, tomate, zapallito, lechuga, pepino.</li><li>Proteínas magras: pollo sin piel, pescado, claras de huevo, legumbres, tofu.</li><li>Carbohidratos de bajo índice glucémico, en porción controlada (un cuarto del plato): legumbres, batata, arroz integral, quinoa, avena.</li><li>Grasas saludables con moderación: palta, aceite de oliva, un puñado de frutos secos.</li><li>Agua como bebida principal.</li></ul><div class="sub" style="font-weight:800;margin-bottom:6px">Limitar o evitar</div><ul class="ej-instrucciones" style="margin-bottom:14px"><li>Azúcar y dulces: golosinas, bebidas azucaradas, jugos.</li><li>Harinas refinadas: pan blanco, facturas, pastas en exceso.</li><li>Frituras, grasas trans y ultraprocesados.</li><li>Alcohol (afecta directamente la glucemia).</li><li>Exceso de sal, aunque tu presión esté normal.</li></ul><div class="sub" style="font-weight:800;margin-bottom:6px">Hábitos generales</div><ul class="ej-instrucciones" style="margin-bottom:14px"><li>Horarios regulares de comida, sin saltear ninguna.</li><li>Método del plato: mitad vegetales, un cuarto proteína, un cuarto carbohidratos.</li><li>Controlá tu glucemia según la frecuencia que te indique tu médico.</li><li>Sumá actividad física regular (la tenés acá arriba, en Rutinas).</li></ul><div class="card accent-accent" style="margin-top:4px"><p class="sub" style="margin:0">Esto es orientación general, no un plan médico personalizado. Para bajar de peso de forma segura con diabetes tipo 2, hacelo acompañado por tu médico o nutricionista — sobre todo si tomás medicación, porque puede haber que ajustarla a medida que cambia tu alimentación.</p></div>`}
function editarPerfilSalud(){let s=AUTH?.settings||{};let d=$('#modal');d.innerHTML=`<form method="dialog" onsubmit="return false"><h2>Tus datos</h2><label class="form-field">Altura (cm)<input id="saludAltura" type="number" step="0.1" value="${s.altura_cm||''}"></label><label class="form-field">Edad<input id="saludEdad" type="number" step="1" min="1" value="${s.edad||''}"></label><label class="form-field">Sexo (para calcular metabolismo basal)<select id="saludSexo"><option value="">Sin especificar</option><option value="m" ${s.sexo==='m'?'selected':''}>Masculino</option><option value="f" ${s.sexo==='f'?'selected':''}>Femenino</option></select></label><label class="form-field">Nivel de actividad física<select id="saludActividad"><option value="">Sin especificar</option><option value="sedentario" ${s.nivel_actividad==='sedentario'?'selected':''}>Sedentario (poco o nada de ejercicio)</option><option value="ligero" ${s.nivel_actividad==='ligero'?'selected':''}>Ligero (1-3 días/semana)</option><option value="moderado" ${s.nivel_actividad==='moderado'?'selected':''}>Moderado (3-5 días/semana)</option><option value="activo" ${s.nivel_actividad==='activo'?'selected':''}>Activo (6-7 días/semana)</option><option value="muy_activo" ${s.nivel_actividad==='muy_activo'?'selected':''}>Muy activo (entreno intenso o trabajo físico)</option></select></label><label class="form-field">Objetivo de peso (kg)<input id="saludPesoObjetivo" type="number" step="0.1" value="${s.peso_objetivo_kg||''}"></label><label class="form-field">Condiciones de salud<textarea id="saludCondiciones">${esc(s.condiciones||'')}</textarea></label><div class="actions" style="margin-top:14px"><button class="cancel" type="button" onclick="$('#modal').close()">Cancelar</button><button class="save" type="button" onclick="guardarPerfilSaludUI()">Guardar</button></div></form>`;d.showModal()}
async function guardarPerfilSaludUI(){try{const r=await api('guardarPerfilSalud',{altura_cm:$('#saludAltura').value,peso_objetivo_kg:$('#saludPesoObjetivo').value,condiciones:$('#saludCondiciones').value,edad:$('#saludEdad').value,sexo:$('#saludSexo').value,nivel_actividad:$('#saludActividad').value});AUTH.settings={...AUTH.settings,...r};$('#modal').close();say('Guardado');render()}catch(e){say(e.message)}}
async function verDetalleEjercicio(id){let d=$('#modal');d.innerHTML='<div class="empty">Cargando…</div>';d.showModal();try{const e=await api('getEjercicio',{id});d.innerHTML=`<h2 style="margin:0 0 4px">${esc(e.nombre)}</h2><p class="sub" style="margin:0 0 10px">${esc(e.musculo_principal||'')}${e.equipamiento?' · '+esc(e.equipamiento):''}${e.nivel?' · '+esc(e.nivel):''}</p><div class="ej-detail-imgs">${(e.imagenes||[]).map(src=>`<img src="${src}">`).join('')}</div><ol class="ej-instrucciones">${(e.instrucciones||[]).map(i=>`<li>${esc(i)}</li>`).join('')||'<li class="empty">Sin instrucciones cargadas.</li>'}</ol><div class="actions" style="margin-top:14px"><button class="cancel" onclick="$('#modal').close()">Cerrar</button></div>`}catch(err){d.innerHTML='<div class="empty">'+esc(err.message)+'</div>'}}async function saveSettings(e){e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.recordatorios_activos=e.target.recordatorios_activos.checked;try{AUTH.settings=await api('saveSettings',p);say('Configuración guardada');render()}catch(err){say(err.message)}}async function testWhatsapp(){let phone=(AUTH?.settings?.whatsapp_phone||'').trim();if(!phone)return say('Guardá primero un teléfono de WhatsApp');busy(1,'Enviando mensaje de prueba…');try{await api('testWhatsapp',{phone});say('Mensaje de prueba enviado')}catch(err){say(err.message)}finally{busy(0)}}async function logout(){await api('logout');localStorage.removeItem('progreso_db');location.reload()}
function aiMonitorCard(){if(!AI_MONITOR)return '<div class="section"><h2>Actividad de IA</h2></div><div class="card"><div class="empty">Cargando actividad de IA…</div></div>';let aviso=AI_MONITOR.warning?'⚠️ Umbral preventivo cercano. Google puede variar su cuota.':'Uso dentro del umbral preventivo.';let eventos=(AI_MONITOR.events||[]).slice(0,6).map(function(e){return '<div class="item"><div class="item-main">'+(e.tipo==='comida'?'Análisis de comida':'Reflexión de bienestar')+'<div class="sub">'+(e.estado==='ok'?'Correcto':'Error')+(e.detalle?' · '+esc(e.detalle):'')+'</div></div></div>'}).join('');return '<div class="section"><h2>Actividad de IA</h2></div><div class="card"><div class="item"><div class="item-main"><b>'+AI_MONITOR.today+'/'+AI_MONITOR.limit+' usos hoy</b><div class="sub">'+aviso+'</div></div></div>'+ (eventos||'<div class="empty">Aún no hay actividad.</div>')+'</div>'}
function filterMyDay(q){q=String(q||"").toLowerCase().trim();document.querySelectorAll("#main .item").forEach(x=>x.style.display=!q||x.innerText.toLowerCase().includes(q)?"flex":"none")}
function openWellbeing(){let d=$('#modal');d.innerHTML=`<form method="dialog"><h2>Reflexión de bienestar</h2><p class="wellbeing-disclaimer">Es una orientación personal, no reemplaza terapia ni atención médica. Las miradas simbólicas se presentan solo como exploración, no como causas comprobadas.</p><label class="form-field">¿Cómo estás hoy?<textarea name="bienestar" placeholder="Contá cómo te sentís, qué te preocupa, qué te molesta o qué necesitás expresar."></textarea></label><button id="wellbeingAnalyzeBtn" type="button" class="save" style="width:100%;padding:12px;border-radius:13px;margin:0 0 10px" onclick="analyzeWellbeing()">✦ Obtener reflexión holística</button><div id="wellbeingResult" class="wellbeing-copy hidden"></div><button id="wellbeingCopyBtn" type="button" class="cancel hidden" style="width:100%;padding:12px;border-radius:13px;margin:0 0 10px;font-weight:800" onclick="copyWellbeing()">Copiar devolución</button><button id="wellbeingSaveBtn" type="button" class="save hidden" style="width:100%;padding:12px;border-radius:13px;margin:0 0 12px;font-weight:800" onclick="saveWellbeing()">Guardar en mi diario</button><div class="actions"><button class="cancel" value="cancel" formnovalidate>Cerrar</button></div></form>`;d.showModal()}async function analyzeWellbeing(){let d=$('#modal'),input=d.querySelector('[name=bienestar]'),btn=$('#wellbeingAnalyzeBtn'),texto=input?.value.trim();if(!texto)return say('Escribí primero cómo te sentís');btn.disabled=true;btn.innerHTML='<span class="mini-spin"></span>Reflexionando…';busy(1,'Preparando tu reflexión…');try{let r=await fetch('/api/analyze-wellbeing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto})}),j=await r.json();if(!j.ok)throw Error(j.error);let result=d.querySelector('#wellbeingResult');result.textContent=j.data.texto;result.classList.remove('hidden');d.querySelector('#wellbeingCopyBtn').classList.remove('hidden');d.querySelector('#wellbeingSaveBtn').classList.remove('hidden');say('Reflexión lista para leer, copiar o guardar')}catch(e){say(e.message||'No se pudo generar la reflexión')}finally{busy(0);btn.disabled=false;btn.textContent='✦ Obtener reflexión holística'}}async function copyWellbeing(){let texto=$('#wellbeingResult')?.textContent||'';if(!texto)return;try{await navigator.clipboard.writeText(texto);say('Devolución copiada')}catch(_){say('No se pudo copiar automáticamente')}}async function saveWellbeing(){let d=$('#modal'),entrada=d.querySelector('[name=bienestar]')?.value.trim(),reflexion=d.querySelector('#wellbeingResult')?.textContent.trim(),btn=d.querySelector('#wellbeingSaveBtn');if(!entrada||!reflexion)return;btn.disabled=true;try{await act('addDiario',{fecha:today(),texto:'Bienestar\n\nLo que escribí:\n'+entrada+'\n\nReflexión holística orientativa:\n'+reflexion},'Reflexión guardada en tu diario');btn.textContent='Guardado en mi diario'}catch(e){say(e.message);btn.disabled=false}}
async function foodImagePayload(file){let url=URL.createObjectURL(file),img=await new Promise((ok,bad)=>{let i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url}),max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height)),w=Math.round((img.naturalWidth||img.width)*scale),h=Math.round((img.naturalHeight||img.height)*scale),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);return {image:canvas.toDataURL('image/jpeg',.76).split(',')[1],mimeType:'image/jpeg'}}async function analyzeFoodPhoto(){let d=$('#modal'),file=d.querySelector('[name=foto]')?.files?.[0],btn=$('#foodAnalyzeBtn');if(!file)return say('Elegí o sacá una foto primero');if(btn?.disabled)return;btn.disabled=true;btn.innerHTML='<span class="mini-spin"></span>Analizando foto…';busy(1,'Analizando tu foto con IA…');try{let body=await foodImagePayload(file);if(body.image.length>3_800_000)throw Error('La foto sigue siendo muy grande; acercate al plato o usá otra foto');let r=await fetch('/api/analyze-food',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!j.ok)throw Error(j.error);let x=j.data,foods=(x.alimentos||[]).map(a=>a.nombre+(a.porcion?' ('+a.porcion+')':'')).join(', ');d.querySelector('[name=alimentos]').value=foods;['calorias','proteinas','carbohidratos','grasas','nota'].forEach(k=>{let el=d.querySelector('[name='+k+']');if(el&&x[k]!=null)el.value=x[k]});say('Estimación lista: revisala antes de guardar')}catch(e){say(e.message||'No se pudo preparar la foto')}finally{busy(0);if(btn){btn.disabled=false;btn.textContent='✦ Analizar foto con IA'}}}
function quickFoodPhoto(){openNutrition(true)}function openNutrition(openPicker=false){let d=$('#modal');d.innerHTML=`<form method="dialog"><h2>Registrar comida</h2><label class="form-field">Foto del plato<input name="foto" type="file" accept="image/*"></label><button id="foodAnalyzeBtn" type="button" class="save" style="width:100%;padding:12px;border-radius:13px;margin:-4px 0 12px" onclick="analyzeFoodPhoto()">✦ Analizar foto con IA</button><p class="frequency-note">La imagen se envía a Gemini para analizarla y se descarta: no se guarda en VidaPlus.</p><label class="form-field">Tipo de comida<select name="tipo"><option value="Desayuno">Desayuno</option><option value="Almuerzo">Almuerzo</option><option value="Merienda">Merienda</option><option value="Cena">Cena</option><option value="Snack">Snack</option></select></label><label class="form-field">Fecha<input name="fecha" type="date" value="${today()}"></label><label class="form-field">Alimentos<textarea name="alimentos" placeholder="Ej. Pollo a la plancha, arroz y ensalada"></textarea></label><label class="form-field">Calorías estimadas<input name="calorias" type="number" min="0" placeholder="Ej. 550"></label><label class="form-field">Proteínas (g)<input name="proteinas" type="number" min="0" step="0.1"></label><label class="form-field">Carbohidratos (g)<input name="carbohidratos" type="number" min="0" step="0.1"></label><label class="form-field">Grasas (g)<input name="grasas" type="number" min="0" step="0.1"></label><label class="form-field">Nota<input name="nota" placeholder="Opcional"></label><div class="actions"><button class="cancel" value="cancel" formnovalidate>Cancelar</button><button class="save" value="save">Guardar comida</button></div></form>`;d.showModal();if(openPicker)setTimeout(()=>d.querySelector('[name=foto]')?.click(),120);d.onclose=async()=>{if(d.returnValue!=='save')return;let p=Object.fromEntries(new FormData(d.querySelector('form')));p.alimentos=String(p.alimentos||'').split(',').map(nombre=>({nombre:nombre.trim()})).filter(x=>x.nombre);delete p.foto;act('addComida',p,'Comida registrada')}}
function openForm(kind,id){let row=id?(kind==='tareas'?DB.tareas:kind==='habitos'?DB.habitos:kind==='peso'?DB.pesos:kind==='diario'?DB.diario:DB.entrenamientos).find(x=>x.id===id):{};let fields=kind==='tareas'?`<label class="form-field">Tarea<input name="texto" placeholder="¿Qué querés hacer?" value="${esc(row.texto||'')}"></label><label class="form-field">Fecha<input name="fecha" type="date" value="${row.fecha||today()}"></label><label class="form-field">Hora<input name="hora" type="time" step="60" value="${row.vencimiento?row.vencimiento.slice(11,16):''}"></label><label class="inline-check"><input name="alerta" type="checkbox" ${row.alerta?'checked':''}>Avisar por WhatsApp</label>`:kind==='habitos'?`<label class="form-field">Hábito<input name="nombre" placeholder="Ej. Tomar agua" value="${esc(row.nombre||'')}"></label><label class="form-field">Frecuencia<select name="frecuencia"><option value="diario" ${(row.frecuencia||'diario')==='diario'?'selected':''}>Diario</option><option value="semanal" ${row.frecuencia==='semanal'?'selected':''}>Semanal</option><option value="mensual" ${row.frecuencia==='mensual'?'selected':''}>Mensual</option></select></label><label class="form-field">Día semanal (opcional)<select name="dia_semana"><option value="">Cualquier día</option><option value="0" ${String(row.dia_semana)==='0'?'selected':''}>Lunes</option><option value="1" ${String(row.dia_semana)==='1'?'selected':''}>Martes</option><option value="2" ${String(row.dia_semana)==='2'?'selected':''}>Miércoles</option><option value="3" ${String(row.dia_semana)==='3'?'selected':''}>Jueves</option><option value="4" ${String(row.dia_semana)==='4'?'selected':''}>Viernes</option><option value="5" ${String(row.dia_semana)==='5'?'selected':''}>Sábado</option><option value="6" ${String(row.dia_semana)==='6'?'selected':''}>Domingo</option></select></label><label class="form-field">Día del mes (opcional)<input name="dia_mes" type="number" min="1" max="31" value="${row.dia_mes||''}" placeholder="Ej. 1"></label>`:kind==='peso'?`<label class="form-field">Peso (kg)<input name="kg" type="number" step="0.1" placeholder="Ej. 72.5" value="${row.kg||''}"></label><label class="form-field">Fecha<input name="fecha" type="date" value="${row.fecha||today()}"></label><label class="form-field">Nota<input name="nota" placeholder="Opcional" value="${esc(row.nota||'')}"></label>`:kind==='diario'?`<label class="form-field">Fecha<input name="fecha" type="date" value="${row.fecha||today()}"></label><label class="form-field">Nota del día<textarea name="texto" placeholder="¿Cómo estuvo tu día?">${esc(row.texto||'')}</textarea></label>`:`<label class="form-field">Tipo de entrenamiento<input name="tipo" placeholder="Ej. Fuerza, running, movilidad" value="${esc(row.tipo||'')}"></label><label class="form-field">Qué incluye<textarea name="detalle" placeholder="Ej. pecho, espalda y core">${esc(row.detalle||'')}</textarea></label><label class="form-field">Desde<input name="fecha" type="date" value="${row.fecha||today()}"></label><label class="form-field">Hasta<input name="fecha_hasta" type="date" value="${row.fecha_hasta||''}"></label><label class="form-field">Duración (minutos)<input name="duracion_min" type="number" placeholder="Minutos" value="${row.duracion_min||''}"></label><label class="form-field">Nota<input name="nota" placeholder="Nota opcional" value="${esc(row.nota||'')}"></label>`;let habitoArchivado=kind==='habitos'&&(row.activo===false||row.activo==='false');let d=$('#modal');d.innerHTML=`<form method="dialog"><h2>${id?'Editar':'Agregar'} ${kind==='peso'?'peso':kind.slice(0,-1)}</h2>${fields}<div class="actions">${id&&kind==='habitos'?`<button class="cancel" value="archive">${habitoArchivado?'Reactivar':'Archivar'}</button>`:''}${id?'<button class="danger" value="delete">Eliminar</button>':''}<button class="cancel" value="cancel" formnovalidate>Cancelar</button><button class="save" value="save">Guardar</button></div></form>`;d.showModal();d.onclose=async()=>{if(!d.returnValue||d.returnValue==='cancel')return;let p=Object.fromEntries(new FormData(d.querySelector('form')));if(kind==='tareas'){p.alerta=d.querySelector('[name=alerta]')?.checked||false;p.vencimiento=p.hora?p.fecha+'T'+p.hora:null;delete p.hora}let names={tareas:'Tarea',habitos:'Habito',peso:'Peso',entrenamientos:'Entrenamiento',diario:'Diario'};if(d.returnValue==='archive')return act('updateHabito',{id,activo:habitoArchivado},habitoArchivado?'Hábito reactivado':'Hábito archivado');if(d.returnValue==='delete'){if(!confirm('¿Eliminar este registro? No se puede deshacer.'))return;return act('delete'+names[kind],{id},'Eliminado')}act((id?'update':'add')+names[kind],id?{id,...p}:p,id?'Cambios guardados':'Registro agregado')}}
load();
</script></body></html>
