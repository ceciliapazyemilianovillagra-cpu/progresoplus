function home(){let done=DB.tareas.filter(x=>x.hecha).length,total=DB.tareas.length,logs=DB.habitoLogs.filter(x=>x.fecha===today()).length,proximas=DB.tareas.filter(x=>!x.hecha).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,3);return `<section class="view on"><span class="date">${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</span><h1>Hola, ¡vamos por hoy!</h1><div class="hero"><p>Tu consistencia de hoy</p><strong>${total?Math.round(done/total*100):0}%</strong><p>${done} de ${total} tareas completadas</p></div><div class="grid"><div class="card"><small>Hábitos hoy</small><div class="metric">${logs}/${DB.habitos.length}</div></div><div class="card"><small>Último peso</small><div class="metric">${DB.pesos.length?latest(DB.pesos).kg+' kg':'—'}</div></div></div><div class="section"><h2>Evolución de peso</h2><button class="link" onclick="go('fisico')">Ver todo</button></div><div class="card chart-card">${weightChart()}</div><div class="section"><h2>Agenda</h2></div><div class="card">${calendarWidget()}</div><div class="section"><h2>Próximas tareas</h2><button class="link" onclick="go('dia')">Ver todo</button></div><div class="card">${proximas.map(taskItem).join('')||'<div class="empty">No tenés tareas pendientes. ¡Agregá algo que te importe!</div>'}</div></section>`}function latest(a){return a.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]}
function module(kind){if(kind==='dia'){let done=DB.tareas.filter(x=>x.hecha).length,marked=DB.habitoLogs.filter(x=>x.fecha===today()).length,pend=DB.tareas.filter(x=>!x.hecha).sort((a,b)=>a.fecha.localeCompare(b.fecha)),hechas=DB.tareas.filter(x=>x.hecha).sort((a,b)=>b.fecha.localeCompare(a.fecha));return dashboard('Mi día',`${done+marked}/${DB.tareas.length+DB.habitos.length}`,'Acciones completadas hoy',DB.tareas.length+DB.habitos.length?(done+marked)/(DB.tareas.length+DB.habitos.length)*100:0)+`<div class="section"><h2>Tareas</h2><button class="link" onclick="openForm('tareas')">Agregar</button></div><div class="card">${pend.map(taskItem).join('')||'<div class="empty">No tenés tareas pendientes 🎉</div>'}</div>${hechas.length?`<details class="card done-list"><summary>Completadas (${hechas.length})</summary>${hechas.map(taskItem).join('')}</details>`:''}<div class="section"><h2>Hábitos</h2><button class="link" onclick="openForm('habitos')">Agregar</button></div><div class="card">${DB.habitos.filter(h=>verArchivados||(h.activo!==false&&h.activo!=='false')).map(h=>{let on=DB.habitoLogs.some(l=>String(l.habito_id)===String(h.id)&&l.fecha===today()),arch=h.activo===false||h.activo==='false';return `<div class="item"><button class="check ${on?'done':''}" aria-label="${on?'Desmarcar hábito de hoy':'Marcar hábito de hoy'}" onclick="act('toggleHabitoLog',{habito_id:'${h.id}',fecha:today()})">${on?'✓':''}</button><div class="item-main">${esc(h.nombre)}${arch?' <span class="sub">(archivado)</span>':''}<div class="sub">${DB.habitoLogs.filter(l=>String(l.habito_id)===String(h.id)).length} días registrados</div></div><button class="more" aria-label="Editar" onclick="openForm('habitos','${h.id}')">•••</button></div>`}).join('')||'<div class="empty">Creá tu primer hábito.</div>'}</div><button class="link" style="margin:6px 2px" onclick="verArchivados=!verArchivados;render()">${verArchivados?'Ocultar archivados':'Ver archivados'}</button>`}if(kind==='fisico'){let sortedPesos=DB.pesos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)),peso=sortedPesos.length?sortedPesos[0].kg+' kg':'—';return dashboard('Progreso físico',peso,'Último peso registrado')+`<div class="section"><h2>Peso</h2><button class="link" onclick="openForm('peso')">Agregar</button></div><div class="card">${sortedPesos.map((x,i)=>{let prev=sortedPesos[i+1],d=prev?+(x.kg-prev.kg).toFixed(1):0,dTxt=prev?(d>0?' · +'+d+' kg':d<0?' · '+d+' kg':' · sin cambios'):'';return item(x,'peso',x.kg+' kg',fmt(x.fecha)+dTxt+(x.nota?' · '+esc(x.nota):''))}).join('')||'<div class="empty">Todavía no hay registros.</div>'}</div><div class="section"><h2>Entrenamientos</h2><button class="link" onclick="openForm('entrenamientos')">Agregar</button></div><div class="card">${DB.entrenamientos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(x=>item(x,'entrenamientos',esc(x.tipo),fmt(x.fecha)+' · '+x.duracion_min+' min'+(x.nota?' · '+esc(x.nota):''))).join('')||'<div class="empty">Todavía no hay entrenamientos.</div>'}</div>`}let arr=DB.diario;return dashboard('Diario',arr.length+' notas','Entradas guardadas')+`<div class="card">${arr.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(x=>item(x,'diario',fmt(x.fecha),esc(x.texto))).join('')||'<div class="empty">Escribí cómo estuvo tu día.</div>'}</div>`}
function render(){let html=view==='inicio'?home():`<section class="view on">${module(view)}</section>`;$('#main').innerHTML=html+(view==='diario'?`<button class="fab" onclick="openForm('diario')">＋ Agregar nota</button>`:'');$('#nav').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===view))}function go(v){view=v;render()}$('#nav').onclick=e=>{let b=e.target.closest('button');if(b)go(b.dataset.v)};
function openForm(kind,id){let row=id?(kind==='tareas'?DB.tareas:kind==='habitos'?DB.habitos:kind==='peso'?DB.pesos:kind==='diario'?DB.diario:DB.entrenamientos).find(x=>x.id===id):{};let fields=kind==='tareas'?`<input name="texto" placeholder="¿Qué querés hacer?" value="${esc(row.texto||'')}"><input name="fecha" type="date" value="${row.fecha||today()}">`:kind==='habitos'?`<input name="nombre" placeholder="Nombre del hábito" value="${esc(row.nombre||'')}">`:kind==='peso'?`<input name="kg" type="number" step="0.1" placeholder="Peso en kg" value="${row.kg||''}"><input name="fecha" type="date" value="${row.fecha||today()}"><input name="nota" placeholder="Nota opcional" value="${esc(row.nota||'')}">`:kind==='diario'?`<input name="fecha" type="date" value="${row.fecha||today()}"><textarea name="texto" placeholder="¿Cómo estuvo tu día?">${esc(row.texto||'')}</textarea>`:`<input name="tipo" placeholder="Tipo de entrenamiento" value="${esc(row.tipo||'')}"><input name="duracion_min" type="number" placeholder="Minutos" value="${row.duracion_min||''}"><input name="fecha" type="date" value="${row.fecha||today()}"><input name="nota" placeholder="Nota opcional" value="${esc(row.nota||'')}">`;let habitoArchivado=kind==='habitos'&&(row.activo===false||row.activo==='false');let d=$('#modal');d.innerHTML=`<form method="dialog"><h2>${id?'Editar':'Agregar'} ${kind==='peso'?'peso':kind.slice(0,-1)}</h2>${fields}<div class="actions">${id&&kind==='habitos'?`<button class="cancel" value="archive">${habitoArchivado?'Reactivar':'Archivar'}</button>`:''}${id?'<button class="danger" value="delete">Eliminar</button>':''}<button class="cancel" value="cancel">Cancelar</button><button class="save" value="save">Guardar</button></div></form>`;d.showModal();d.onclose=async()=>{if(!d.returnValue||d.returnValue==='cancel')return;let p=Object.fromEntries(new FormData(d.querySelector('form')));let names={tareas:'Tarea',habitos:'Habito',peso:'Peso',entrenamientos:'Entrenamiento',diario:'Diario'};if(d.returnValue==='archive')return act('updateHabito',{id,activo:habitoArchivado},habitoArchivado?'Hábito reactivado':'Hábito archivado');if(d.returnValue==='delete'){if(!confirm('¿Eliminar este registro? No se puede deshacer.'))return;return act('delete'+names[kind],{id},'Eliminado')}act((id?'update':'add')+names[kind],id?{id,...p}:p,id?'Cambios guardados':'Registro agregado')}}
load();
</script></body></html>
