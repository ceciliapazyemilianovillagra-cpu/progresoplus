async function goUsers(){try{USERS=await api('listUsers');view='usuarios';render()}catch(e){say(e.message)}}async function refreshUsers(){USERS=await api('listUsers');render()}function openUserForm(id){let u=id?USERS.find(x=>x.id===id):{},d=$('#modal');d.innerHTML=`<form method="dialog"><h2>${id?'Editar usuario':'Nuevo usuario'}</h2><label class="form-field">Nombre completo<input name="nombre" placeholder="Ej. Ana Pérez" value="${esc(u?.nombre||'')}" required></label><label class="form-field">Usuario<input name="usuario" placeholder="Ej. ana.perez" value="${esc(u?.usuario||'')}" required></label><label class="form-field">Email<input name="email" type="email" placeholder="correo@ejemplo.com" value="${esc(u?.email||'')}" required></label><label class="form-field">Rol<select name="rol"><option value="user" ${u?.rol!=='admin'?'selected':''}>Usuario</option><option value="admin" ${u?.rol==='admin'?'selected':''}>Administrador</option></select></label><label class="form-field">${id?'Nueva contraseña (para blanquear)':'Contraseña inicial'}<input name="password" type="password" placeholder="Mínimo 8 caracteres" ${id?'':'required'} minlength="8"></label><div class="actions">${id?'<button class="cancel" value="reset">Blanquear clave</button><button class="danger" value="delete">Eliminar</button>':''}<button class="cancel" value="cancel" formnovalidate>Cancelar</button><button class="save" value="save">Guardar</button></div></form>`;d.showModal();d.onclose=async()=>{if(!d.returnValue||d.returnValue==='cancel')return;let p=Object.fromEntries(new FormData(d.querySelector('form')));try{if(d.returnValue==='delete'){if(!confirm('¿Eliminar este usuario?'))return;await api('deleteUser',{id});say('Usuario eliminado')}else if(d.returnValue==='reset'){if(!p.password||p.password.length<8)throw Error('Indicá una nueva contraseña de al menos 8 caracteres');await api('resetPassword',{id,password:p.password});say('Clave restablecida')}else{if(id)await api('updateUser',{id,nombre:p.nombre,usuario:p.usuario,email:p.email,rol:p.rol});else await api('createUser',p);say(id?'Usuario actualizado':'Usuario creado')}await refreshUsers()}catch(e){say(e.message)}}}
function render(){let html=view==='inicio'?home():`<section class="view on">${module(view)}</section>`;$('#main').innerHTML=html;$('#nav').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===view))}async function loadAiMonitoring(){if(AUTH?.user?.rol!=='admin')return;try{AI_MONITOR=await api('getAiMonitoring');if(view==='config')render()}catch(_){}}function go(v){if(v==='analizar')return quickFoodPhoto();view=v;render();if(v==='config')loadAiMonitoring()}async function saveSettings(e){e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.recordatorios_activos=e.target.recordatorios_activos.checked;try{AUTH.settings=await api('saveSettings',p);say('Configuración guardada');render()}catch(err){say(err.message)}}async function logout(){await api('logout');localStorage.removeItem('progreso_db');location.reload()}$('#nav').onclick=e=>{let b=e.target.closest('button');if(b)go(b.dataset.v)};
function aiMonitorCard(){if(!AI_MONITOR)return '<div class="section"><h2>Actividad de IA</h2></div><div class="card"><div class="empty">Cargando actividad de IA…</div></div>';let aviso=AI_MONITOR.warning?'⚠️ Umbral preventivo cercano. Google puede variar su cuota.':'Uso dentro del umbral preventivo.';let eventos=(AI_MONITOR.events||[]).slice(0,6).map(function(e){return '<div class="item"><div class="item-main">'+(e.tipo==='comida'?'Análisis de comida':'Reflexión de bienestar')+'<div class="sub">'+(e.estado==='ok'?'Correcto':'Error')+(e.detalle?' · '+esc(e.detalle):'')+'</div></div></div>'}).join('');return '<div class="section"><h2>Actividad de IA</h2></div><div class="card"><div class="item"><div class="item-main"><b>'+AI_MONITOR.today+'/'+AI_MONITOR.limit+' usos hoy</b><div class="sub">'+aviso+'</div></div></div>'+ (eventos||'<div class="empty">Aún no hay actividad.</div>')+'</div>'}
function filterMyDay(q){q=String(q||"").toLowerCase().trim();document.querySelectorAll("#main .item").forEach(x=>x.style.display=!q||x.innerText.toLowerCase().includes(q)?"flex":"none")}
function openWellbeing(){let d=$('#modal');d.innerHTML=`<form method="dialog"><h2>Reflexión de bienestar</h2><p class="wellbeing-disclaimer">Es una orientación personal, no reemplaza terapia ni atención médica. Las miradas simbólicas se presentan solo como exploración, no como causas comprobadas.</p><label class="form-field">¿Cómo estás hoy?<textarea name="bienestar" placeholder="Contá cómo te sentís, qué te preocupa, qué te molesta o qué necesitás expresar."></textarea></label><button id="wellbeingAnalyzeBtn" type="button" class="save" style="width:100%;padding:12px;border-radius:13px;margin:0 0 10px" onclick="analyzeWellbeing()">✦ Obtener reflexión holística</button><div id="wellbeingResult" class="wellbeing-copy hidden"></div><button id="wellbeingCopyBtn" type="button" class="cancel hidden" style="width:100%;padding:12px;border-radius:13px;margin:0 0 10px;font-weight:800" onclick="copyWellbeing()">Copiar devolución</button><button id="wellbeingSaveBtn" type="button" class="save hidden" style="width:100%;padding:12px;border-radius:13px;margin:0 0 12px;font-weight:800" onclick="saveWellbeing()">Guardar en mi diario</button><div class="actions"><button class="cancel" value="cancel" formnovalidate>Cerrar</button></div></form>`;d.showModal()}async function analyzeWellbeing(){let d=$('#modal'),input=d.querySelector('[name=bienestar]'),btn=$('#wellbeingAnalyzeBtn'),texto=input?.value.trim();if(!texto)return say('Escribí primero cómo te sentís');btn.disabled=true;btn.innerHTML='<span class="mini-spin"></span>Reflexionando…';busy(1,'Preparando tu reflexión…');try{let r=await fetch('/api/analyze-wellbeing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto})}),j=await r.json();if(!j.ok)throw Error(j.error);let result=d.querySelector('#wellbeingResult');result.textContent=j.data.texto;result.classList.remove('hidden');d.querySelector('#wellbeingCopyBtn').classList.remove('hidden');d.querySelector('#wellbeingSaveBtn').classList.remove('hidden');say('Reflexión lista para leer, copiar o guardar')}catch(e){say(e.message||'No se pudo generar la reflexión')}finally{busy(0);btn.disabled=false;btn.textContent='✦ Obtener reflexión holística'}}async function copyWellbeing(){let texto=$('#wellbeingResult')?.textContent||'';if(!texto)return;try{await navigator.clipboard.writeText(texto);say('Devolución copiada')}catch(_){say('No se pudo copiar automáticamente')}}async function saveWellbeing(){let d=$('#modal'),entrada=d.querySelector('[name=bienestar]')?.value.trim(),reflexion=d.querySelector('#wellbeingResult')?.textContent.trim(),btn=d.querySelector('#wellbeingSaveBtn');if(!entrada||!reflexion)return;btn.disabled=true;try{await act('addDiario',{fecha:today(),texto:'Bienestar\n\nLo que escribí:\n'+entrada+'\n\nReflexión holística orientativa:\n'+reflexion},'Reflexión guardada en tu diario');btn.textContent='Guardado en mi diario'}catch(e){say(e.message);btn.disabled=false}}
async function foodImagePayload(file){let url=URL.createObjectURL(file),img=await new Promise((ok,bad)=>{let i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url}),max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height)),w=Math.round((img.naturalWidth||img.width)*scale),h=Math.round((img.naturalHeight||img.height)*scale),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);return {image:canvas.toDataURL('image/jpeg',.76).split(',')[1],mimeType:'image/jpeg'}}async function analyzeFoodPhoto(){let d=$('#modal'),file=d.querySelector('[name=foto]')?.files?.[0],btn=$('#foodAnalyzeBtn');if(!file)return say('Elegí o sacá una foto primero');if(btn?.disabled)return;btn.disabled=true;btn.innerHTML='<span class="mini-spin"></span>Analizando foto…';busy(1,'Analizando tu foto con IA…');try{let body=await foodImagePayload(file);if(body.image.length>3_800_000)throw Error('La foto sigue siendo muy grande; acercate al plato o usá otra foto');let r=await fetch('/api/analyze-food',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!j.ok)throw Error(j.error);let x=j.data,foods=(x.alimentos||[]).map(a=>a.nombre+(a.porcion?' ('+a.porcion+')':'')).join(', ');d.querySelector('[name=alimentos]').value=foods;['calorias','proteinas','carbohidratos','grasas','nota'].forEach(k=>{let el=d.querySelector('[name='+k+']');if(el&&x[k]!=null)el.value=x[k]});say('Estimación lista: revisala antes de guardar')}catch(e){say(e.message||'No se pudo preparar la foto')}finally{busy(0);if(btn){btn.disabled=false;btn.textContent='✦ Analizar foto con IA'}}}
function quickFoodPhoto(){openNutrition(true)}function openNutrition(openPicker=false){let d=$('#modal');d.innerHTML=`<form method="dialog"><h2>Registrar comida</h2><label class="form-field">Foto del plato<input name="foto" type="file" accept="image/*"></label><button id="foodAnalyzeBtn" type="button" class="save" style="width:100%;padding:12px;border-radius:13px;margin:-4px 0 12px" onclick="analyzeFoodPhoto()">✦ Analizar foto con IA</button><p class="frequency-note">La imagen se envía a Gemini para analizarla y se descarta: no se guarda en Progreso+.</p><label class="form-field">Tipo de comida<select name="tipo"><option value="Desayuno">Desayuno</option><option value="Almuerzo">Almuerzo</option><option value="Merienda">Merienda</option><option value="Cena">Cena</option><option value="Snack">Snack</option></select></label><label class="form-field">Fecha<input name="fecha" type="date" value="${today()}"></label><label class="form-field">Alimentos<textarea name="alimentos" placeholder="Ej. Pollo a la plancha, arroz y ensalada"></textarea></label><label class="form-field">Calorías estimadas<input name="calorias" type="number" min="0" placeholder="Ej. 550"></label><label class="form-field">Proteínas (g)<input name="proteinas" type="number" min="0" step="0.1"></label><label class="form-field">Carbohidratos (g)<input name="carbohidratos" type="number" min="0" step="0.1"></label><label class="form-field">Grasas (g)<input name="grasas" type="number" min="0" step="0.1"></label><label class="form-field">Nota<input name="nota" placeholder="Opcional"></label><div class="actions"><button class="cancel" value="cancel" formnovalidate>Cancelar</button><button class="save" value="save">Guardar comida</button></div></form>`;d.showModal();if(openPicker)setTimeout(()=>d.querySelector('[name=foto]')?.click(),120);d.onclose=async()=>{if(d.returnValue!=='save')return;let p=Object.fromEntries(new FormData(d.querySelector('form')));p.alimentos=String(p.alimentos||'').split(',').map(nombre=>({nombre:nombre.trim()})).filter(x=>x.nombre);delete p.foto;act('addComida',p,'Comida registrada')}}
function openForm(kind,id){let row=id?(kind==='tareas'?DB.tareas:kind==='habitos'?DB.habitos:kind==='peso'?DB.pesos:kind==='diario'?DB.diario:DB.entrenamientos).find(x=>x.id===id):{};let fields=kind==='tareas'?`<label class="form-field">Tarea<input name="texto" placeholder="¿Qué querés hacer?" value="${esc(row.texto||'')}"></label><label class="form-field">Fecha<input name="fecha" type="date" value="${row.fecha||today()}"></label><label class="form-field">Fecha y hora de vencimiento<input name="vencimiento" type="datetime-local" value="${row.vencimiento?row.vencimiento.slice(0,16):''}"></label><label class="inline-check"><input name="alerta" type="checkbox" ${row.alerta?'checked':''}>Agregar alerta de vencimiento</label>`:kind==='habitos'?`<label class="form-field">Hábito<input name="nombre" placeholder="Ej. Tomar agua" value="${esc(row.nombre||'')}"></label><label class="form-field">Frecuencia<select name="frecuencia"><option value="diario" ${(row.frecuencia||'diario')==='diario'?'selected':''}>Diario</option><option value="semanal" ${row.frecuencia==='semanal'?'selected':''}>Semanal</option><option value="mensual" ${row.frecuencia==='mensual'?'selected':''}>Mensual</option></select></label><label class="form-field">Día semanal (opcional)<select name="dia_semana"><option value="">Cualquier día</option><option value="0" ${String(row.dia_semana)==='0'?'selected':''}>Lunes</option><option value="1" ${String(row.dia_semana)==='1'?'selected':''}>Martes</option><option value="2" ${String(row.dia_semana)==='2'?'selected':''}>Miércoles</option><option value="3" ${String(row.dia_semana)==='3'?'selected':''}>Jueves</option><option value="4" ${String(row.dia_semana)==='4'?'selected':''}>Viernes</option><option value="5" ${String(row.dia_semana)==='5'?'selected':''}>Sábado</option><option value="6" ${String(row.dia_semana)==='6'?'selected':''}>Domingo</option></select></label><label class="form-field">Día del mes (opcional)<input name="dia_mes" type="number" min="1" max="31" value="${row.dia_mes||''}" placeholder="Ej. 1"></label>`:kind==='peso'?`<label class="form-field">Peso (kg)<input name="kg" type="number" step="0.1" placeholder="Ej. 72.5" value="${row.kg||''}"></label><label class="form-field">Fecha<input name="fecha" type="date" value="${row.fecha||today()}"></label><label class="form-field">Nota<input name="nota" placeholder="Opcional" value="${esc(row.nota||'')}"></label>`:kind==='diario'?`<label class="form-field">Fecha<input name="fecha" type="date" value="${row.fecha||today()}"></label><label class="form-field">Nota del día<textarea name="texto" placeholder="¿Cómo estuvo tu día?">${esc(row.texto||'')}</textarea></label>`:`<label class="form-field">Tipo de entrenamiento<input name="tipo" placeholder="Ej. Fuerza, running, movilidad" value="${esc(row.tipo||'')}"></label><label class="form-field">Qué incluye<textarea name="detalle" placeholder="Ej. pecho, espalda y core">${esc(row.detalle||'')}</textarea></label><label class="form-field">Desde<input name="fecha" type="date" value="${row.fecha||today()}"></label><label class="form-field">Hasta<input name="fecha_hasta" type="date" value="${row.fecha_hasta||''}"></label><label class="form-field">Duración (minutos)<input name="duracion_min" type="number" placeholder="Minutos" value="${row.duracion_min||''}"></label><label class="form-field">Nota<input name="nota" placeholder="Nota opcional" value="${esc(row.nota||'')}"></label>`;let habitoArchivado=kind==='habitos'&&(row.activo===false||row.activo==='false');let d=$('#modal');d.innerHTML=`<form method="dialog"><h2>${id?'Editar':'Agregar'} ${kind==='peso'?'peso':kind.slice(0,-1)}</h2>${fields}<div class="actions">${id&&kind==='habitos'?`<button class="cancel" value="archive">${habitoArchivado?'Reactivar':'Archivar'}</button>`:''}${id?'<button class="danger" value="delete">Eliminar</button>':''}<button class="cancel" value="cancel" formnovalidate>Cancelar</button><button class="save" value="save">Guardar</button></div></form>`;d.showModal();d.onclose=async()=>{if(!d.returnValue||d.returnValue==='cancel')return;let p=Object.fromEntries(new FormData(d.querySelector('form')));if(kind==='tareas')p.alerta=d.querySelector('[name=alerta]')?.checked||false;let names={tareas:'Tarea',habitos:'Habito',peso:'Peso',entrenamientos:'Entrenamiento',diario:'Diario'};if(d.returnValue==='archive')return act('updateHabito',{id,activo:habitoArchivado},habitoArchivado?'Hábito reactivado':'Hábito archivado');if(d.returnValue==='delete'){if(!confirm('¿Eliminar este registro? No se puede deshacer.'))return;return act('delete'+names[kind],{id},'Eliminado')}act((id?'update':'add')+names[kind],id?{id,...p}:p,id?'Cambios guardados':'Registro agregado')}}
load();
</script></body></html>
