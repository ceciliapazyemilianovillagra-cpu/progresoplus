<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva contraseña — VidaPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--violet:#193b2a;--accent:#d73431;--cream:#f1ece3;--ink:#12241a;--muted:#5c675d;--line:#e3ddd3}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',sans-serif;background:#faf6ee;color:var(--ink);min-height:100dvh;display:grid;place-items:center;align-content:center;gap:0;padding:20px}
.card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:none}
h1{font-size:22px;margin:0 0 6px;text-align:center}
p{color:var(--muted);margin:0 0 20px;font-size:14px;line-height:1.5;text-align:center}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:16px}
input{width:100%;margin-top:6px;padding:13px;border:1px solid var(--line);border-radius:13px;font-size:14px;font-family:inherit;background:var(--cream);box-sizing:border-box}
button{width:100%;border:0;border-radius:14px;padding:15px;background:var(--violet);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:#a52c28;font-size:13px;margin-top:10px;display:none;text-align:center}
a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;background:var(--violet);color:#fff;font-weight:800;font-size:15px;text-decoration:none;box-sizing:border-box;text-align:center}
body::before{content:'';display:block;width:56px;height:56px;margin:0 auto 18px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%22256%22%20fill%3D%22%23e67339%22%2F%3E%3Cpath%20d%3D%22M180%20190%20256%20330%20332%20190%22%20fill%3D%22none%22%20stroke%3D%22%23faf5ea%22%20stroke-width%3D%2246%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.page-logo{display:none}
button,a.btn,a.soporte{border-radius:10px!important}
h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:28px;letter-spacing:-.02em}
.card{border:0!important;border-radius:28px!important;box-shadow:0 1px 2px #12241a0f,0 12px 32px -16px #12241a2e!important}
button,a.btn{border-radius:99px!important}
</style></head><body>
<div class="card" id="card">
<h1>Elegí tu nueva contraseña</h1>
<p>Tiene que tener al menos 8 caracteres.</p>
<form id="form">
<label>Nueva contraseña<input id="p1" type="password" minlength="8" required autocomplete="new-password"></label>
<label>Repetila<input id="p2" type="password" minlength="8" required autocomplete="new-password"></label>
<button id="btn" type="submit">Guardar contraseña</button>
<p class="err" id="err"></p>
</form>
</div>
<script>
const token=new URLSearchParams(location.search).get('token');
const card=document.getElementById('card');
if(!token){
  card.innerHTML='<h1>Falta información</h1><p>Este link no es válido. Pedí uno nuevo desde la pantalla de inicio de sesión.</p>';
}else{
  document.getElementById('form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
    const err=document.getElementById('err'), btn=document.getElementById('btn');
    err.style.display='none';
    if(p1!==p2){err.textContent='Las contraseñas no coinciden';err.style.display='block';return}
    btn.disabled=true;btn.textContent='Guardando…';
    try{
      const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'confirmarReset',token,password:p1})});
      const j=await r.json();
      if(!j.ok)throw Error(j.error||'No se pudo guardar la contraseña');
      card.innerHTML='<h1>¡Listo!</h1><p>Tu contraseña se actualizó. Ya podés entrar a VidaPlus con la nueva.</p><a class="btn" href="/">Ir a iniciar sesión</a>';
    }catch(e){
      err.textContent=e.message;err.style.display='block';
      btn.disabled=false;btn.textContent='Guardar contraseña';
    }
  });
}
</script>
</body></html>
